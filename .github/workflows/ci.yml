name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -v

  deploy-test:
    # installs the helm chart on a throwaway kind cluster and checks the app responds
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - run: helm lint helm/uptime-monitor
      - run: docker build -t uptime-monitor:ci .
      - uses: helm/kind-action@v1
        with:
          cluster_name: ci
      - run: kind load docker-image uptime-monitor:ci --name ci
      - name: Install chart
        run: |
          helm install uptime helm/uptime-monitor \
            --namespace uptime --create-namespace \
            --set image.repository=uptime-monitor --set image.tag=ci \
            --set ingress.enabled=false \
            --wait --timeout 5m
      - name: Smoke test
        run: |
          kubectl -n uptime port-forward svc/uptime-api 8000:8000 &
          sleep 5
          curl -sf localhost:8000/ready
          curl -sf -X POST localhost:8000/api/targets -H 'Content-Type: application/json' \
            -d '{"name": "example", "url": "https://example.com"}'
          curl -sf localhost:8000/api/targets | grep example
      - name: Debug info
        if: failure()
        run: |
          kubectl -n uptime get pods
          kubectl -n uptime describe pods
          kubectl -n uptime logs -l app.kubernetes.io/instance=uptime --all-containers --tail=50

  image:
    needs: [test, deploy-test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: uptime-monitor:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan with Trivy
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: uptime-monitor:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}

      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
