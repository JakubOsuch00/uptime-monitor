apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "uptime.name" . }}-config
  labels:
    {{- include "uptime.labels" . | nindent 4 }}
data:
  CHECK_INTERVAL: {{ .Values.config.checkInterval | quote }}
  DEFAULT_TARGETS: {{ .Values.config.defaultTargets | quote }}
{{- if not .Values.existingSecret }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "uptime.secretName" . }}
  labels:
    {{- include "uptime.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if .Values.postgres.enabled }}
  POSTGRES_USER: {{ .Values.postgres.user | quote }}
  POSTGRES_PASSWORD: {{ .Values.postgres.password | quote }}
  POSTGRES_DB: {{ .Values.postgres.database | quote }}
  DATABASE_URL: "postgresql+psycopg://{{ .Values.postgres.user }}:{{ .Values.postgres.password }}@{{ include "uptime.name" . }}-postgres:5432/{{ .Values.postgres.database }}"
  {{- else }}
  DATABASE_URL: {{ required "externalDatabaseUrl is required when postgres.enabled=false" .Values.externalDatabaseUrl | quote }}
  {{- end }}
{{- end }}
