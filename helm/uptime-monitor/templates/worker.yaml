apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "uptime.name" . }}-worker
  labels:
    {{- include "uptime.labels" . | nindent 4 }}
spec:
  # one worker only, two would check every site twice
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "uptime.selector" . | nindent 6 }}
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        {{- include "uptime.selector" . | nindent 8 }}
        app.kubernetes.io/component: worker
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9100"
        checksum/config: {{ include (print $.Template.BasePath "/config.yaml") . | sha256sum }}
    spec:
      {{- include "uptime.podSecurity" . | nindent 6 }}
      containers:
        - name: worker
          image: {{ include "uptime.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["python", "-m", "app.worker"]
          ports:
            - name: metrics
              containerPort: 9100
          envFrom:
            - configMapRef:
                name: {{ include "uptime.name" . }}-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "uptime.secretName" . }}
                  key: DATABASE_URL
          livenessProbe:
            httpGet: { path: /metrics, port: metrics }
            periodSeconds: 30
          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}
          {{- include "uptime.containerSecurity" . | nindent 10 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "uptime.name" . }}-worker-metrics
  labels:
    {{- include "uptime.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "uptime.selector" . | nindent 4 }}
    app.kubernetes.io/component: worker
  ports:
    - name: metrics
      port: 9100
      targetPort: metrics
