server {
    listen 80;

    # docker dns - without it nginx keeps the old ip after the api container is recreated
    resolver 127.0.0.11 valid=10s;
    set $api http://api:8000;

    location / {
        proxy_pass $api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # metrics are only for prometheus inside the network
    location /metrics {
        deny all;
    }
}
